<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okello Emergency Quick Loans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="dns-prefetch" href="https://script.google.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAEFEC; --surface:#FFFFFF; --soft:#F4F7F6; --ink:#152A2E; --muted:#5B6E72; --line:#D6DFDD;
  --brand:#0E4F52; --brand-deep:#0A3B3D; --brand-tint:#D3E7E5;
  --amber:#F2AE1C; --amber-deep:#D89400; --amber-ink:#3A2900; --amber-tint:#FCEBC0;
  --good:#1E8A5A; --bad:#C43B30; --bad-tint:#F6D3CF; --info:#2E6DB0;
  --cash:#B27A12; --mpesa:#2C9A55; --bank:#2E6DB0;
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--font);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--brand-deep);color:#D3E4E2;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px}
.brand{display:flex;flex-direction:column;gap:10px;padding:0 8px 22px}
.brand-mark{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;width:118px}
.brand-mark i{height:14px;border-radius:2px;background:#2D6A6C}
.brand-mark i:nth-child(-n+8){background:#7CC3BE}
.brand-mark i:nth-child(9){background:var(--amber)}
.brand b{font:700 19px/1.1 var(--display);color:#fff}
.brand span{font-size:13px;color:#9CC1BE}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;color:#D3E4E2;padding:10px 12px;border-radius:8px;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:#fff;color:var(--brand-deep);font-weight:600}
.nav .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px}
.side-foot{margin-top:auto;padding:12px 10px 0;font-size:13px;color:#9CC1BE;border-top:1px solid rgba(255,255,255,.12)}
.side-foot a{color:#fff}
main{padding:26px 30px 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:30px}
.top p{margin:4px 0 0;color:var(--muted)}
.top .tools{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 15px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#B7C5C2;background:var(--soft)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.amber:hover{background:var(--amber-deep);border-color:var(--amber-deep)}
.btn.teal{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.teal:hover{background:var(--brand-deep)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--soft);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=search],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;padding:9px 11px;border:1px solid #BFCBC9;border-radius:8px;background:#fff}
input:focus,select:focus,textarea:focus{outline:3px solid var(--amber);outline-offset:0;border-color:var(--amber-deep)}
input[readonly]{background:var(--soft);color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label,.lbl{font-weight:600;font-size:13.5px}
.fld .hint{font-size:12.5px;color:var(--muted)}
.fld.bad input,.fld.bad select{border-color:var(--bad);background:#FFF8F7}
.err{color:var(--bad);font-size:12.5px;font-weight:600;min-height:0}
.err:empty{display:none}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--brand);flex:none}
.check.bad{color:var(--bad)}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.panel h2{font-size:18px;margin-bottom:12px}
.panel h2 small{font:400 13.5px var(--font);color:var(--muted);margin-left:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:16px}
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:38px 18px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}
.empty .btn{margin:14px 4px 0}

/* today */
.today{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0;padding:0;overflow:hidden}
.today-l{background:var(--brand);color:#fff;padding:22px 24px}
.today-l h2{font-size:26px;color:#fff;margin-bottom:2px}
.today-l .sub{color:#A9D0CD;font-size:14px}
.today-l .big{font:700 34px/1.1 var(--display);margin:18px 0 4px}
.today-l .of{color:#CFE5E3}
.meter{height:12px;background:#0A3B3D;border-radius:99px;overflow:hidden;margin:14px 0 8px}
.meter i{display:block;height:100%;background:var(--amber);border-radius:99px;min-width:0}
.today-l .foot{font-size:14px;color:#CFE5E3}
.today-r{padding:16px 20px;max-height:400px;overflow:auto}
.today-r h3{font-size:16px;margin-bottom:8px}
.rowline{display:grid;grid-template-columns:minmax(0,1.2fr) 118px 150px auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rowline:first-of-type{border-top:0}
.rowline b{display:block}
.rowline small{color:var(--muted)}
.rowline.two{grid-template-columns:minmax(0,1fr) auto}
.rowline .amt{text-align:right;font-weight:700}
.rowline .amt small{display:block;font-weight:400}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0;margin-top:16px;overflow:hidden}
.stat{padding:16px 18px;border-left:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px}
.stat span{display:block;color:var(--muted);font-size:13.5px}
.stat b{display:block;font:700 22px/1.25 var(--display);margin-top:2px}
.stat small{color:var(--muted);font-size:12.5px}
.stat.warn b{color:var(--bad)}

/* charts */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font:12px var(--font);fill:var(--muted)}
.modebar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--soft);margin:6px 0 12px}
.modebar i{display:block;height:100%}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span:first-child{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* ---------- pills / chips ---------- */
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.active{background:var(--brand-tint);color:var(--brand-deep)}
.pill.behind{background:var(--amber-tint);color:#6B4700}
.pill.defaulted{background:var(--bad-tint);color:#8A1F17}
.pill.completed{background:#DDEFE5;color:#14663F}
.pill.upcoming{background:#E4E9E8;color:var(--muted)}
.pill.paid{background:#DDEFE5;color:#14663F}
.pill.partial{background:var(--brand-tint);color:var(--brand-deep)}
.pill.short,.pill.missed{background:var(--bad-tint);color:#8A1F17}
.pill.due{background:var(--amber-tint);color:#6B4700}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.mode i{width:9px;height:9px;border-radius:50%}
.mode.cash i{background:var(--cash)}.mode.mpesa i{background:var(--mpesa)}.mode.bank i{background:var(--bank)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-weight:600;font-size:13.5px;cursor:pointer}
.chip b{color:var(--muted);font-weight:600;margin-left:4px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on b{color:#B9CBC9}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.toolbar input[type=search]{flex:1 1 280px;max-width:520px}
.toolbar .fld{flex:0 0 auto}

/* ---------- 13-day strip: one cell per repayment day ---------- */
.strip{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;min-width:104px}
.c{height:16px;border-radius:2px;--p:0%;--fill:var(--brand);--empty:#E1E7E6;background:linear-gradient(to top,var(--fill) var(--p),var(--empty) var(--p))}
.c.paid{--p:100%}
.c.partial{--empty:#C9DFDD}
.c.short{--empty:#F1BFB9}
.c.missed{--empty:#F1BFB9;box-shadow:inset 0 0 0 1px #E19A92}
.c.due{--empty:var(--amber-tint);box-shadow:inset 0 0 0 1.5px var(--amber-deep)}
.c.now{outline:2px solid var(--ink);outline-offset:1px}
.strip.big .c{height:22px}

/* ---------- member list ---------- */
.mem{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.mem.open{border-color:#93B5B2}
.mem-head{display:grid;grid-template-columns:minmax(190px,1.35fr) 104px minmax(150px,1fr) 100px 112px auto;gap:14px;align-items:center;padding:12px 14px;cursor:pointer;border-radius:12px}
.mem-head:hover{background:#FAFCFB}
.mem-toggle{all:unset;display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0}
.mem-toggle:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
.chev{width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 3px}
.mem.open .chev{transform:rotate(45deg)}
.who{display:flex;flex-direction:column;min-width:0}
.who b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fig b,.bal b{display:block;font-size:15px}
.fig span,.bal span,.prog span{display:block;color:var(--muted);font-size:12.5px}
.prog .strip{margin-bottom:4px}
.acts{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.menu{position:relative}
.menu>summary{list-style:none;cursor:pointer}
.menu>summary::-webkit-details-marker{display:none}
.menu-list{position:absolute;right:0;top:calc(100% + 4px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;min-width:190px;padding:5px;box-shadow:0 10px 28px rgba(10,59,61,.18)}
.menu-list button{all:unset;display:block;width:100%;padding:9px 11px;border-radius:7px;cursor:pointer;box-sizing:border-box;font-weight:500}
.menu-list button:hover,.menu-list button:focus-visible{background:var(--soft)}
.menu-list button.danger{color:var(--bad)}

.mem-body{border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;cursor:default}
.mem-body h3{font-size:16px;margin-bottom:8px}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px;background:var(--soft)}
td.num,th.num{text-align:right}
tfoot td{font-weight:700;background:var(--soft)}
tr.is-today td{background:var(--amber-tint)}
tr.d-upcoming td{color:#7A8B8E}
.days td:first-child{font-weight:700}
.side-col{display:flex;flex-direction:column;gap:16px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;text-align:right;overflow-wrap:anywhere}
.box{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.hist{list-style:none;margin:0;padding:0;font-size:14px}
.hist li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist small{color:var(--muted);display:block}
.x-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px;font-weight:600}
.x-btn:hover{background:var(--bad-tint);color:var(--bad)}
.ok-tag{color:var(--good);font-weight:700;font-size:13px}

/* ---------- dialog ---------- */
dialog{border:0;padding:0;border-radius:14px;max-width:calc(100vw - 20px);width:640px;background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(10,30,32,.35)}
dialog.narrow{width:470px}
dialog::backdrop{background:rgba(10,40,42,.55)}
.dlg{padding:0;max-height:min(90vh,900px);overflow:auto}
.dlg>header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dlg>header h2{font-size:21px}
.dlg .x{border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 8px;border-radius:6px}
.dlg .x:hover{background:var(--soft)}
.dlg .body{padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.dlg>footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font:700 16px var(--display);padding:0;margin-bottom:10px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.cols .full{grid-column:1/-1}
.summary4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--brand-tint);border-radius:10px;padding:12px}
.summary4 span{display:block;font-size:12.5px;color:#2E5B5D}
.summary4 b{font-size:15px}
.segs{display:flex;gap:8px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1.5px solid #BFCBC9;border-radius:8px;font-weight:600;cursor:pointer;background:#fff}
.seg input:checked+span{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-deep)}
.seg input:focus-visible+span{outline:3px solid var(--amber);outline-offset:2px}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.qchips button{border:1px dashed #9DB1AF;background:var(--soft);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600;cursor:pointer}
.qchips button:hover{background:var(--amber-tint);border-color:var(--amber-deep)}
.mini-card{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.preview{background:var(--amber-tint);border-radius:8px;padding:9px 12px;font-size:14px}
.preview:empty{display:none}
details.terms{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--soft)}
details.terms summary{cursor:pointer;font-weight:600}
details.terms ol{margin:10px 0 0;padding-left:20px;font-size:13.5px}
details.terms li{margin-bottom:6px}
.pick-list{display:flex;flex-direction:column;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pick-list button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.pick-list button:first-child{border-top:0}
.pick-list button:hover,.pick-list button:focus-visible{background:var(--amber-tint)}

/* toasts */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;width:min(440px,calc(100vw - 24px))}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;display:flex;justify-content:space-between;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast button{background:transparent;border:1px solid #6E8785;color:#fff;border-radius:7px;padding:4px 10px;font-weight:600;cursor:pointer}

/* settings */
.kvbig{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kvbig div{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kvbig span{display:block;color:var(--muted);font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
code,pre{font:13px ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border-radius:6px}
pre{padding:10px 12px;overflow:auto;white-space:pre-wrap;margin:8px 0}

/* print */
#printArea{display:none}
@media print{
  body{background:#fff}
  .app,dialog,.toasts{display:none!important}
  #printArea{display:block;color:#000;font:13px/1.5 Georgia,"Times New Roman",serif}
  #printArea h1{font:700 22px var(--display);text-align:center;margin:0}
  #printArea h2{font:700 16px var(--display);margin:16px 0 6px}
  #printArea .sub{text-align:center;margin:2px 0 14px}
  #printArea .fill{display:inline-block;min-width:110px;border-bottom:1px solid #000;padding:0 6px;font-weight:700}
  #printArea .lines{display:flex;gap:30px;margin-top:28px}
  #printArea .lines div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:12px}
  #printArea ol{padding-left:18px}
  #printArea .rc{width:320px;margin:0 auto;border:1px dashed #000;padding:14px}
  #printArea .rc table td{border:0;padding:3px 0;font-size:13px}
  #printArea .rc table td:last-child{text-align:right;font-weight:700}
}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .mem-head{grid-template-columns:minmax(0,1fr) 100px 108px auto;grid-template-areas:"who fig bal acts" "prog prog pill pill"}
  .mem-head .mem-toggle{grid-area:who}.mem-head .fig{grid-area:fig}.mem-head .bal{grid-area:bal}.mem-head .acts{grid-area:acts}
  .mem-head .prog{grid-area:prog}.mem-head .pillcell{grid-area:pill;justify-self:end}
  .mem-body,.grid2,.grid2.even,.today{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 8px;z-index:30;border-top:1px solid rgba(255,255,255,.15)}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav a{flex:1;justify-content:center;padding:10px 6px;font-size:14px}
  main{padding:18px 14px 90px}
  .top h1{font-size:25px}
  .toasts{bottom:78px}
  .cols{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .summary4{grid-template-columns:repeat(2,1fr)}
  .rowline{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who amt" "strip pay"}
  .rowline.two{grid-template-areas:none}.rowline.two>*{grid-area:auto!important}
  .rowline>:nth-child(1){grid-area:who}.rowline>:nth-child(2){grid-area:strip}.rowline>:nth-child(3){grid-area:amt}.rowline>:nth-child(4){grid-area:pay;justify-self:end}
}
@media (max-width:520px){
  .mem-head{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who acts" "fig bal" "prog prog" "pill pill"}

<script>
/* =====================================================================
   OKELLO'S EMERGENCY QUICK LOANS  -  front end
   ---------------------------------------------------------------------
   Data lives in this browser (localStorage) until you connect Google
   Sheets. To connect: deploy your Apps Script web app and paste its URL
   into CONFIG.API_URL. See the Backend object and the Settings page for
   the sheet columns this app expects.
   ===================================================================== */
const CONFIG = {
  BUSINESS: "Okello's Emergency Quick Loans",
  INTEREST_RATE: 0.30,      // clause 3: 30% of principal
  DAYS: 13,                 // clause 2: repay within 13 days
  MIN_AGE: 18,              // clause 1
  MIN_LOAN: 500,            // your own limits, set MAX_LOAN to 0 for no maximum
  MAX_LOAN: 0,
  DAY1_OFFSET_DAYS: 0,      // 0 = Day 1 is the start date. Use 1 if the first payment is the day after disbursement
  API_URL: "https://script.google.com/macros/s/AKfycbxmZ8KvSgYR8o9jPeTvibVhEiTkq5KPFGlhLZ5wq1kFXZ4G8Bzt0LrIh6hCFzbeVxyp/exec",              // Google Apps Script web app URL (leave empty for offline mode)
  STORAGE_KEY: "okello_quick_loans_v1"
};

const SESSION_KEY = "okello_admin_session";
let adminUser = null;
let adminKey = null;

const TERMS = [
  ["Eligibility Requirements", "Applicants must be at least 18 years of age and are required to present a valid National Identification Card on the application day."],
  ["Loan Duration", "Okello\u2019s Emergency Quick Loans are short-term loans, to be repaid in installment of at least 10% daily within a period of 13 days from the disbursement date."],
  ["Interest Rate and Repayment", "Loans disbursed are subject to an interest charge of 30% of the principal amount. The total loan amount, including interest, must be repaid within 13 days."],
  ["Guarantor Requirements", "A guarantor for the loan application must be a person whose identity is verified by the server and who is available for reference at any time during the loan period."],
  ["Consequences of Non-Repayment", "Failure to repay the loan within the stipulated period may result in legal action being taken against both the borrower and the guarantor."],
  ["Acknowledgment of Terms", "All applicants must thoroughly read and understand these terms and conditions prior to submitting an application for a loan."]
];
const OCCUPATIONS = ["Driver", "Owner of the vehicle", "Green grocery", "Hotel", "Others"];
const MODES = { cash: "Cash", mpesa: "M-Pesa", bank: "Bank" };

/* ---------------------------- utilities ---------------------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const num = n => r2(n).toLocaleString("en-KE", { maximumFractionDigits: 2 });
const money = n => "KSh " + num(n);
const pad = (n, l = 2) => String(n).padStart(l, "0");
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => fmtISO(new Date());
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return fmtISO(d); };
const diffDays = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 864e5);
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const fmtDate = s => { if (!s) return "\u2013"; const d = parseISO(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtShort = s => { const d = parseISO(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ageOn = (dob, ref) => { const d = parseISO(dob), r = parseISO(ref); let a = r.getFullYear() - d.getFullYear(); if (((r.getMonth() - d.getMonth()) || (r.getDate() - d.getDate())) < 0) a--; return a; };
const normPhone = s => { let d = String(s || "").replace(/\D/g, ""); if (d.startsWith("254")) d = "0" + d.slice(3); else if (/^[17]\d{8}$/.test(d)) d = "0" + d; return /^0[17]\d{8}$/.test(d) ? d : null; };
const showPhone = p => p && p.length === 10 ? `${p.slice(0, 4)} ${p.slice(4, 7)} ${p.slice(7)}` : (p || "");
const tel = p => `tel:+254${String(p).slice(1)}`;
const byId = id => Store.data.members.find(m => m.id === id);
const occLabel = m => m.occupation === "Others" && m.occupationOther ? m.occupationOther : m.occupation;

/* ------------------------------ store ------------------------------ */
const Store = {
  data: { members: [], counters: { member: 0, receipt: 0 }, settings: { staff: "", lastMode: "cash" } },
  load() {
    try { const raw = localStorage.getItem(CONFIG.STORAGE_KEY); if (raw) this.data = Object.assign(this.data, JSON.parse(raw)); } catch (e) { console.warn(e); }
    this.data.counters = Object.assign({ member: 0, receipt: 0 }, this.data.counters);
    this.data.settings = Object.assign({ staff: "", lastMode: "cash" }, this.data.settings);
    if (!Array.isArray(this.data.members)) this.data.members = [];
  },
  save() {
    try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(this.data)); return true; }
    catch (e) { toast("This browser is blocking storage, so changes will be lost on refresh."); return false; }
  }
};

/* Google Sheets bridge. Off until CONFIG.API_URL is set.
   Suggested Apps Script contract:
     GET  ?action=getAll               -> { members:[...] }
     POST {action, payload} as text/plain (avoids CORS preflight)
     actions: member.save, member.delete, loan.renew, payment.add, payment.delete */
async function apiPost(payload) {
  const res = await fetch(CONFIG.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
  const text = await res.text();
  try { return JSON.parse(text); } catch (e) { throw new Error("Unexpected response from the server."); }
}
const Backend = {
  enabled: () => !!CONFIG.API_URL,
  async pull() {
    if (!this.enabled()) return;
    try {
      const d = await (await fetch(CONFIG.API_URL + "?action=getAll&key=" + encodeURIComponent(adminKey || ""))).json();
      if (d && d.error === "unauthorized") { doLogout("Your session expired. Please log in again."); return; }
      if (d && Array.isArray(d.members)) { Store.data.members = d.members; Store.save(); render(); }
    } catch (e) { toast("Could not reach the Google Sheet. Showing data saved on this device."); }
  },
  async push(action, payload) {
    if (!this.enabled()) return;
    try {
      const d = await apiPost({ action, payload, key: adminKey });
      if (d && d.error === "unauthorized") { doLogout("Your session expired. Please log in again."); }
    }
    catch (e) { toast("Saved on this device, but the Google Sheet was not updated."); }
  }
};
const persist = (action, payload) => { Store.save(); Backend.push(action, payload); };

/* ---------------------------- session/auth --------------------------- */
function loadSession() {
  try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function saveSession(username, password) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({ username, password })); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}
function enterApp(username, password) {
  adminUser = username; adminKey = password;
  document.body.classList.add("authed");
  const err = $("#loginErr"); if (err) err.textContent = "";
  render_foot(); render(); Backend.pull();
}
function doLogout(message) {
  adminUser = null; adminKey = null;
  clearSession();
  document.body.classList.remove("authed");
  const err = $("#loginErr"); if (err) err.textContent = message || "";
  const p = $("#loginPass"); if (p) p.value = "";
  setTimeout(() => { const u = $("#loginUser"); if (u) u.focus(); }, 0);
}
async function submitLogin(f) {
  const btn = $("#loginBtn"), err = $("#loginErr");
  const username = f.elements.username.value.trim(), password = f.elements.password.value;
  if (!username || !password) { err.textContent = "Enter your username and password."; return; }
  btn.disabled = true; btn.textContent = "Checking…"; err.textContent = "";
  try {
    if (!Backend.enabled()) { err.textContent = "No backend connected — set CONFIG.API_URL first."; return; }
    const res = await apiPost({ action: "login", payload: { username, password } });
    if (res && res.success) { saveSession(username, password); enterApp(username, password); }
    else { err.textContent = (res && res.error) || "Incorrect username or password."; }
  } catch (e) { err.textContent = "Couldn't reach the server: " + e.message; }
  finally { btn.disabled = false; btn.textContent = "Log in"; }
}
async function submitChangePassword(f) {
  const msg = $("#pwMsg"), btn = $("#pwBtn");
  const oldPassword = f.elements.oldPassword.value, newPassword = f.elements.newPassword.value, newPassword2 = f.elements.newPassword2.value;
  if (!oldPassword || !newPassword) { msg.className = "msg msg-bad"; msg.textContent = "Fill in all password fields."; return; }
  if (newPassword !== newPassword2) { msg.className = "msg msg-bad"; msg.textContent = "New passwords don't match."; return; }
  btn.disabled = true; msg.className = "msg"; msg.textContent = "Saving…";
  try {
    const res = await apiPost({ action: "changePassword", payload: { oldPassword, newPassword } });
    if (res && res.success) { adminKey = newPassword; saveSession(adminUser, adminKey); msg.className = "msg msg-good"; msg.textContent = "Password updated."; f.reset(); }
    else { msg.className = "msg msg-bad"; msg.textContent = (res && res.error) || "Couldn't update password."; }
  } catch (e) { msg.className = "msg msg-bad"; msg.textContent = "Couldn't reach the server: " + e.message; }
  finally { btn.disabled = false; }
}

/* -------------------------- loan arithmetic ------------------------ */
function buildLoan(principal, start, cycle, applied, servedBy) {
  const total = r2(principal * (1 + CONFIG.INTEREST_RATE));
  return {
    cycle, principal: r2(principal), rate: CONFIG.INTEREST_RATE, interest: r2(total - principal), total,
    daily: r2(total / CONFIG.DAYS), start, end: addDays(start, CONFIG.DAY1_OFFSET_DAYS + CONFIG.DAYS - 1), applied, servedBy
  };
}
const loanPayments = (m, cycle = m.loan.cycle) =>
  m.payments.filter(p => p.cycle === cycle).sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt);

/* Payments fill the days in order (Day 1 first), so an overpayment on one
   day carries forward and a short payment leaves the day part-paid. */
function buildSchedule(loan, pays) {
  const days = [];
  for (let i = 0; i < CONFIG.DAYS; i++) {
    const due = i < CONFIG.DAYS - 1 ? loan.daily : r2(loan.total - loan.daily * (CONFIG.DAYS - 1));
    days.push({ n: i + 1, date: addDays(loan.start, CONFIG.DAY1_OFFSET_DAYS + i), due, paid: 0, parts: [] });
  }
  let di = 0;
  for (const p of pays) {
    let left = p.amount;
    while (left > 0.004 && di < days.length) {
      const d = days[di], room = r2(d.due - d.paid);
      if (room <= 0.004) { di++; continue; }
      const take = Math.min(room, left);
      d.paid = r2(d.paid + take); d.parts.push({ pay: p, amount: r2(take) }); left = r2(left - take);
    }
  }
  return days;
}
function dayStatus(d, t) {
  const rem = r2(d.due - d.paid);
  if (rem <= 0.004) return "paid";
  if (d.date < t) return d.paid > 0 ? "short" : "missed";
  if (d.date === t) return d.paid > 0 ? "partial" : "due";
  return d.paid > 0 ? "partial" : "upcoming";
}
function summary(m, t = today()) {
  const L = m.loan, pays = loanPayments(m), days = buildSchedule(L, pays);
  days.forEach(d => { d.rem = Math.max(0, r2(d.due - d.paid)); d.status = dayStatus(d, t); });
  const paid = r2(pays.reduce((s, p) => s + p.amount, 0));
  const balance = Math.max(0, r2(L.total - paid));
  const expBefore = r2(days.filter(d => d.date < t).reduce((s, d) => s + d.due, 0));
  const expThrough = r2(days.filter(d => d.date <= t).reduce((s, d) => s + d.due, 0));
  const arrears = Math.max(0, r2(expBefore - paid));
  const dueNow = Math.min(balance, Math.max(0, r2(expThrough - paid)));
  let status = "active";
  if (balance <= 0.004) status = "completed";
  else if (t < days[0].date) status = "upcoming";
  else if (t > L.end) status = "defaulted";
  else if (arrears > 0.004) status = "behind";
  const late = days.filter(d => d.date < t && d.rem > 0.004).length;
  const dayNo = t < days[0].date ? 0 : Math.min(CONFIG.DAYS, diffDays(t, days[0].date) + 1);
  return {
    m, L, pays, days, paid, balance, arrears, dueNow, expThrough, status, late, dayNo,
    nextDay: days.find(d => d.rem > 0.004), pct: L.total ? paid / L.total : 0,
    paidToday: r2(pays.filter(p => p.date === t).reduce((s, p) => s + p.amount, 0))
  };
}
function allocationPreview(s, amount) {
  let left = amount; const out = [];
  for (const d of s.days) {
    if (left <= 0.004) break; if (d.rem <= 0.004) continue;
    const take = Math.min(d.rem, left); out.push({ n: d.n, full: take >= d.rem - 0.004, take }); left = r2(left - take);
  }
  return out;
}
const suggestAmount = s => r2(Math.min(s.balance, s.dueNow > 0.004 ? s.dueNow : (s.nextDay ? s.nextDay.rem : s.balance)));

/* ---------------------------- portfolio ---------------------------- */
function portfolio() {
  const t = today(), rows = Store.data.members.map(m => summary(m, t));
  const pays = Store.data.members.flatMap(m => m.payments.map(p => ({ ...p, member: m })));
  const loans = Store.data.members.flatMap(m => [m.loan, ...(m.pastLoans || [])]);
  const running = rows.filter(s => s.status !== "completed" && s.status !== "upcoming");
  const inPeriod = rows.filter(s => s.status === "active" || s.status === "behind");
  const P = { t, rows, pays };
  P.collectedToday = r2(pays.filter(p => p.date === t).reduce((s, p) => s + p.amount, 0));
  P.dueToday = r2(inPeriod.reduce((s, r) => s + r.dueNow, 0));
  P.target = r2(P.collectedToday + P.dueToday);
  P.toPay = inPeriod.filter(r => r.dueNow > 0.004);
  P.outstanding = r2(rows.filter(s => s.status !== "completed").reduce((s, r) => s + r.balance, 0));
  P.overdue = r2(rows.reduce((s, r) => s + r.arrears, 0));
  P.behind = rows.filter(r => r.status === "behind" || r.status === "defaulted").sort((a, b) => b.arrears - a.arrears);
  P.activeCount = rows.filter(r => r.status === "active" || r.status === "behind" || r.status === "upcoming").length;
  P.disbursed = r2(loans.reduce((s, l) => s + l.principal, 0));
  P.collected = r2(pays.reduce((s, p) => s + p.amount, 0));
  P.interestBooked = r2(loans.reduce((s, l) => s + l.interest, 0));
  const exp = rows.reduce((s, r) => s + Math.min(r.expThrough, r.L.total), 0);
  const got = rows.reduce((s, r) => s + Math.min(r.paid, r.expThrough), 0);
  P.health = exp > 0 ? got / exp : null;
  P.running = running;
  return P;
}
function dailySeries(P, n = 14) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push({ date: addDays(P.t, -i), exp: 0, got: 0 });
  const idx = Object.fromEntries(out.map((o, i) => [o.date, i]));
  P.pays.forEach(p => { if (p.date in idx) out[idx[p.date]].got += p.amount; });
  Store.data.members.forEach(m => [m.loan, ...(m.pastLoans || [])].forEach(L => {
    const days = buildSchedule(L, []);
    days.forEach(d => { if (d.date in idx) out[idx[d.date]].exp += d.due; });
  }));
  return out;
}

/* ------------------------------- UI bits ---------------------------- */
const dlg = $("#modal");
function openModal(html, cls = "") { dlg.className = cls; dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
function closeModal() { if (dlg.open) dlg.close(); }
dlg.addEventListener("click", e => { if (e.target === dlg) closeModal(); });

function toast(msg, action) {
  const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ""}`;
  if (action) $("button", el).onclick = () => { action.run(); el.remove(); };
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), action ? 8000 : 4200);
}

function strip(s, big) {
  const t = today();
  const label = `Repayment progress: ${s.days.filter(d => d.status === "paid").length} of ${CONFIG.DAYS} days paid`;
  return `<div class="strip ${big ? "big" : ""}" role="img" aria-label="${label}">${s.days.map(d => {
    const p = d.status === "paid" ? 100 : d.status === "partial" || d.status === "short" ? Math.round(d.paid / d.due * 100) : 0;
    return `<i class="c ${d.status}${d.date === t ? " now" : ""}" style="--p:${p}%" title="Day ${d.n}, ${fmtShort(d.date)}: ${d.status === "paid" ? "paid" : d.status}"></i>`;
  }).join("")}</div>`;
}
function pill(s) {

const statusCountAll = (P, k) => P.rows.filter(r => r.status === k).length;
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function barChart(series) {
  const W = 640, H = 210, L = 44, B = 26, T = 8, n = series.length;
  const max = niceMax(Math.max(1, ...series.map(s => Math.max(s.exp, s.got))));
  const bw = (W - L) / n, y = v => T + (H - T - B) * (1 - v / max);
  const k = v => v >= 1000 ? (v / 1000) + "k" : v;
  let g = "";
  [0, .5, 1].forEach(f => { const v = max * f; g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#D6DFDD" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${k(v)}</text>`; });
  series.forEach((s, i) => {
    const x = L + i * bw, dd = parseISO(s.date), isT = i === n - 1;
    g += `<g><title>${fmtShort(s.date)}: collected ${money(s.got)} of ${money(s.exp)} expected</title>
      <rect x="${x + bw * .12}" y="${y(s.exp)}" width="${bw * .76}" height="${Math.max(0, H - B - y(s.exp))}" rx="3" fill="#C9DFDD"/>
      <rect x="${x + bw * .27}" y="${y(s.got)}" width="${bw * .46}" height="${Math.max(0, H - B - y(s.got))}" rx="2" fill="#0E4F52"/>
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" ${isT ? 'style="font-weight:700;fill:#152A2E"' : ""}>${dd.getDate()}</text></g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Collected versus expected for the last ${n} days">${g}</svg>`;
}

function setErrors(f, errs) {
  $$(".err", f).forEach(e => e.textContent = ""); $$(".bad", f).forEach(e => e.classList.remove("bad"));
  const keys = Object.keys(errs); if (!keys.length) return false;
  keys.forEach(k => { const e = $(`[data-err="${k}"]`, f); if (e) { e.textContent = errs[k]; const p = e.closest(".fld, .check"); if (p) p.classList.add("bad"); } });
  const first = f.elements[keys[0]]; if (first) { first.focus(); first.scrollIntoView({ block: "center" }); }
  return true;
}

function submitMember(f) {
  const editId = f.dataset.id, m0 = editId ? byId(editId) : null, t = today();
  const locked = m0 && m0.payments.some(p => p.cycle === m0.loan.cycle);
  const v = n => (f.elements[n] ? f.elements[n].value : "").trim(), chk = n => !!(f.elements[n] && f.elements[n].checked);
  const e = {};
  const rec = { name: v("fullName").replace(/\s+/g, " "), idNo: v("idNo").replace(/\s/g, ""), dob: v("dob"), phone: normPhone(v("phone")), occupation: v("occupation"), occupationOther: v("occupationOther"), plate: v("plate").toUpperCase(), stall: v("stall"), area: v("area") };
  const G = { name: v("gName").replace(/\s+/g, " "), phone: normPhone(v("gPhone")), idNo: v("gIdNo").replace(/\s/g, ""), verified: chk("gVerified") };
  let principal = locked ? m0.loan.principal : Math.round(parseFloat(v("principal")));
  const start = locked ? m0.loan.start : v("start"), applied = v("applied"), servedBy = v("servedBy");
  if (rec.name.length < 3) e.fullName = "Enter the applicant's full name.";
  if (!/^\d{6,10}$/.test(rec.idNo)) e.idNo = "Enter the ID number using digits only (6 to 10)."; 
  else { const dup = Store.data.members.find(x => x.idNo === rec.idNo && x.id !== editId); if (dup) e.idNo = `Already registered to ${dup.name} (${dup.code}). Renew that loan instead.`; }
  if (!rec.dob) e.dob = "Enter the date of birth.";
  else if (rec.dob > t) e.dob = "Date of birth cannot be in the future.";
  else if (ageOn(rec.dob, t) < CONFIG.MIN_AGE) e.dob = `Applicant is ${ageOn(rec.dob, t)}. Loans are only for ${CONFIG.MIN_AGE} and above.`;
  if (!rec.phone) e.phone = "Enter a Kenyan number such as 0712 345 678.";
  if (!rec.occupation) e.occupation = "Choose the applicant's occupation.";
  if (rec.occupation === "Others" && !rec.occupationOther) e.occupationOther = "Say what the applicant does.";
  if ((rec.occupation === "Driver" || rec.occupation === "Owner of the vehicle") && !rec.plate) e.plate = "Enter the vehicle number plate.";
  if (rec.occupation === "Green grocery" && !rec.stall) e.stall = "Enter the stall number.";
  if (!rec.area) e.area = "Enter the area of operation.";
  if (!locked) {
    if (!(principal >= CONFIG.MIN_LOAN)) e.principal = `Minimum loan is ${money(CONFIG.MIN_LOAN)}.`;
    else if (CONFIG.MAX_LOAN && principal > CONFIG.MAX_LOAN) e.principal = `Maximum loan is ${money(CONFIG.MAX_LOAN)}.`;
    if (!start) e.start = "Choose the first repayment day.";
  }
  if (!applied) e.applied = "Enter the application date."; else if (start && applied > start) e.applied = "Application cannot be after the first repayment day.";
  if (!servedBy) e.servedBy = "Enter who served the applicant.";
  if (G.name.length < 3) e.gName = "Enter the guarantor's full name.";
  if (!G.phone) e.gPhone = "Enter a Kenyan number such as 0712 345 678.";
  else if (G.phone === rec.phone) e.gPhone = "Guarantor needs their own phone number.";
  if (!/^\d{6,10}$/.test(G.idNo)) e.gIdNo = "Enter the guarantor's ID number using digits only.";
  else if (G.idNo === rec.idNo) e.gIdNo = "The guarantor cannot be the borrower.";
  if (!G.verified) e.gVerified = "Check the guarantor's ID before saving.";
  if (!m0) { if (!chk("okId")) e.okId = "A valid National ID must be presented."; if (!chk("okTerms")) e.okTerms = "The applicant must accept the terms."; }
  if (setErrors(f, e)) return;

  if (m0) {
    Object.assign(m0, rec, { guarantor: G });
    if (!locked) m0.loan = buildLoan(principal, start, m0.loan.cycle, applied, servedBy);
    else { m0.loan.applied = applied; m0.loan.servedBy = servedBy; }
    persist("member.save", m0); closeModal(); render(); toast(`Saved changes to ${m0.name}.`);
  } else {
    const c = Store.data.counters; c.member++;
    const m = { id: uid("m"), code: "M" + pad(c.member, 4), ...rec, guarantor: G, loan: buildLoan(principal, start, 1, applied, servedBy), pastLoans: [], payments: [], termsAccepted: true, createdAt: Date.now() };
    Store.data.members.push(m); state.open.add(m.id); state.q = ""; state.status = "all";
    Store.data.settings.staff = Store.data.settings.staff || servedBy;
    persist("member.save", m); closeModal(); go("members");
    toast(`Loan of ${money(principal)} created for ${m.name}.`, { label: "Print agreement", run: () => printDoc(agreementHTML(m)) });
  }
}

function submitPayment(f) {

  <div class="lines"><div>Applicant's signature</div><div>Date</div></div>
  <p><b>2. Witnesses</b><br>Witness (guarantor): ${f(g.name)} &nbsp; Telephone No: ${f(showPhone(g.phone))} &nbsp; ID No: ${f(g.idNo)}</p>
  <div class="lines"><div>Guarantor's signature</div><div>Date</div></div>
  <p style="margin-top:22px">Date of application: ${f(fmtDate(L.applied))} &nbsp; Served by: ${f(L.servedBy)} &nbsp; Member code: ${f(m.code)}</p>`;
}
function receiptHTML(m, p) {
  const list = loanPayments(m, p.cycle), idx = list.findIndex(x => x.id === p.id);
  const loan = p.cycle === m.loan.cycle ? m.loan : (m.pastLoans || []).find(l => l.cycle === p.cycle) || m.loan;
  const paidTo = list.slice(0, idx + 1).reduce((s, x) => s + x.amount, 0);
  return `<div class="rc"><h1 style="font-size:17px">${esc(CONFIG.BUSINESS)}</h1><p class="sub">Payment receipt</p>
  <table><tr><td>Receipt</td><td>${esc(p.receipt)}</td></tr><tr><td>Date</td><td>${fmtDate(p.date)}</td></tr><tr><td>Member</td><td>${esc(m.name)} (${esc(m.code)})</td></tr>
  <tr><td>Amount</td><td>KSh ${num(p.amount)}</td></tr><tr><td>Mode</td><td>${MODES[p.mode]}</td></tr>${p.ref ? `<tr><td>Reference</td><td>${esc(p.ref)}</td></tr>` : ""}
  <tr><td>Paid so far</td><td>KSh ${num(paidTo)}</td></tr><tr><td>Balance</td><td>KSh ${num(Math.max(0, loan.total - paidTo))}</td></tr><tr><td>Received by</td><td>${esc(p.receivedBy)}</td></tr></table>
  <p class="sub" style="margin-top:12px">Thank you</p></div>`;
}

/* ------------------------- export, backup, demo --------------------- */
const csvRows = rows => rows.map(r => r.map(v => { v = String(v ?? ""); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(",")).join("\r\n");
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function exportMembers() {
  const rows = [["id", "code", "name", "idNo", "dob", "phone", "occupation", "occupationOther", "plate", "stall", "area", "guarantorName", "guarantorPhone", "guarantorIdNo", "guarantorVerified", "cycle", "principal", "interest", "total", "daily", "start", "end", "applied", "servedBy", "status", "paid", "balance", "createdAt"]];
  Store.data.members.forEach(m => { const s = summary(m), L = m.loan, g = m.guarantor; rows.push([m.id, m.code, m.name, m.idNo, m.dob, m.phone, m.occupation, m.occupationOther, m.plate, m.stall, m.area, g.name, g.phone, g.idNo, g.verified, L.cycle, L.principal, L.interest, L.total, L.daily, L.start, L.end, L.applied, L.servedBy, s.status, s.paid, s.balance, m.createdAt]); });
  download("members-" + today() + ".csv", "\ufeff" + csvRows(rows), "text/csv");
}
function exportPayments() {
  const rows = [["id", "memberId", "code", "name", "cycle", "receipt", "date", "amount", "mode", "ref", "receivedBy", "note", "createdAt"]];
  Store.data.members.forEach(m => m.payments.forEach(p => rows.push([p.id, m.id, m.code, m.name, p.cycle, p.receipt, p.date, p.amount, p.mode, p.ref, p.receivedBy, p.note, p.createdAt])));
  download("payments-" + today() + ".csv", "\ufeff" + csvRows(rows), "text/csv");
}
function loadDemo() {
  const t = today(); let seed = 11; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const staff = Store.data.settings.staff || "Okello";
  const defs = [
    { n: "Peter Otieno", o: "Driver", plate: "KDA 214M", area: "Kencom stage", p: 10000, ago: 5, pat: "yday", g: "Rose Akinyi" },
    { n: "Grace Wanjiru", o: "Green grocery", stall: "G-14", area: "Wakulima Market", p: 3000, ago: 8, pat: "behind", g: "Esther Muthoni" },
    { n: "Hassan Mohamed", o: "Owner of the vehicle", plate: "KCT 883P", area: "Ngara", p: 20000, ago: 3, pat: "today", g: "Amina Yusuf" },
    { n: "Mary Achieng", o: "Hotel", area: "Kisumu Ndogo", p: 5000, ago: 10, pat: "partial", g: "John Odhiambo" },
    { n: "Joseph Kimani", o: "Driver", plate: "KBZ 452Q", area: "Githurai 45", p: 8000, ago: 20, pat: "default", g: "Aloyce John" },
    { n: "Faith Chebet", o: "Green grocery", stall: "B-07", area: "Gikomba", p: 2000, ago: 15, pat: "done", g: "Kevin Rotich" },
    { n: "Brian Mwangi", o: "Others", oo: "Barber", area: "Kawangware", p: 4000, ago: 2, pat: "ahead", g: "Lydia Wambui" },
    { n: "Lucy Njeri", o: "Green grocery", stall: "C-21", area: "Wakulima Market", p: 2500, ago: 0, pat: "yday", g: "Paul Njoroge" },
    { n: "Samuel Kariuki", o: "Driver", plate: "KDG 019T", area: "Railways", p: 6000, ago: -1, pat: "none", g: "Ann Wangari" },
    { n: "Aisha Abdi", o: "Hotel", area: "Eastleigh", p: 12000, ago: 6, pat: "behind", g: "Farah Omar" }
  ];
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789"; let added = 0;
  defs.forEach((d, i) => {
    const idNo = String(30000000 + i * 271); if (Store.data.members.some(x => x.idNo === idNo)) return;
    const c = Store.data.counters; c.member++;
    const start = addDays(t, -d.ago), L = buildLoan(d.p, start, 1, addDays(start, -1), staff);
    const m = { id: uid("m"), code: "M" + pad(c.member, 4), name: d.n, idNo, dob: `${1975 + i * 2}-0${(i % 9) + 1}-1${i % 9}`, phone: "0711" + pad(i * 7 + 101, 6), occupation: d.o, occupationOther: d.oo || "", plate: d.plate || "", stall: d.stall || "", area: d.area,
      guarantor: { name: d.g, phone: "0722" + pad(i * 13 + 205, 6), idNo: String(25000000 + i * 331), verified: true }, loan: L, pastLoans: [], payments: [], termsAccepted: true, createdAt: Date.now() - (d.ago + 1) * 864e5 };
    const elapsed = Math.min(CONFIG.DAYS, diffDays(t, start) + 1);
    for (let k = 0; k < CONFIG.DAYS; k++) {
      const date = addDays(start, k); if (date > t) break;
      const pay = { yday: date < t, today: true, behind: k < Math.floor(elapsed * .4), partial: true, ahead: true, done: true, default: k < 8, none: false }[d.pat];
      if (!pay) continue;
      const amount = d.pat === "partial" && k % 2 === 0 ? r2(L.daily / 2) : L.daily, r = rnd(), mode = r < .6 ? "mpesa" : r < .9 ? "cash" : "bank";
      let ref = ""; if (mode === "mpesa") for (let j = 0; j < 10; j++) ref += chars[Math.floor(rnd() * chars.length)]; if (mode === "bank") ref = "BNK" + pad(Math.floor(rnd() * 999999), 6);
      Store.data.counters.receipt++;
      m.payments.push({ id: uid("p"), memberId: m.id, cycle: 1, receipt: "RC-" + pad(Store.data.counters.receipt, 6), date, amount, mode, ref, receivedBy: staff, note: "", createdAt: parseISO(date).getTime() + 9 * 36e5 + k });
    }
    if (d.pat === "ahead") { Store.data.counters.receipt++; m.payments.push({ id: uid("p"), memberId: m.id, cycle: 1, receipt: "RC-" + pad(Store.data.counters.receipt, 6), date: t, amount: r2(2 * L.daily), mode: "cash", ref: "", receivedBy: staff, note: "Paid two days ahead", createdAt: Date.now() }); }
    Store.data.members.push(m); added++;
  });
  persist("bulk.replace", { members: Store.data.members }); render(); toast(added ? `Added ${added} sample members.` : "Sample members are already loaded.");
}

/* ------------------------------- actions ---------------------------- */
function go(view) { if (location.hash === "#" + view) render(); else location.hash = "#" + view; }
const actions = {
  noop() {},
  closeModal,
  logout() { doLogout(); },
  add() { openMemberForm(); },
  edit(id) { openMemberForm(id); },
  pay(id) { openPay(id); },
  pick() { openPicker(); },
  renew(id) { openRenew(id); },
  toggle(id) {
    if (state.open.has(id)) state.open.delete(id); else state.open.add(id);
    const el = $("#mem-" + id); if (!el) return;
    el.outerHTML = memberCard(summary(byId(id)));
    const b = $(`#mem-${id} .mem-toggle`); if (b && document.activeElement === document.body) b.focus();
  },
  filter(id) { state.status = id; renderMemberList(); },
  setAmt(id, el) { const i = $("#f-amount"); i.value = el.dataset.amt; payFormLive(i.form); i.focus(); },
  clearFilters() { state.pq = state.pfrom = state.pto = ""; state.pmode = "all"; render(); },
  agreement(id) { printDoc(agreementHTML(byId(id))); },
  receipt(id, el) { const m = byId(id); printDoc(receiptHTML(m, m.payments.find(p => p.id === el.dataset.pid))); },
  delete(id) {
    const m = byId(id), n = m.payments.length, paid = m.payments.reduce((s, p) => s + p.amount, 0);
    confirmBox("Delete member?", `<b>${esc(m.name)}</b> (${esc(m.code)}) will be removed along with the loan, guarantor details and ${n} ${n === 1 ? "payment" : "payments"} totalling ${money(paid)}. This cannot be undone.`, "Delete member", () => {
      Store.data.members = Store.data.members.filter(x => x.id !== id); state.open.delete(id); persist("member.delete", { id }); render(); toast(`${m.name} was deleted.`);
    });
  },
  delpay(id, el) {
    const m = byId(id), p = m.payments.find(x => x.id === el.dataset.pid);
    confirmBox("Delete this payment?", `${money(p.amount)} from ${esc(m.name)} on ${fmtDate(p.date)} (${MODES[p.mode]}${p.ref ? ", " + esc(p.ref) : ""}, ${esc(p.receipt)}) will be removed and the 13-day record recalculated.`, "Delete payment", () => {
      m.payments = m.payments.filter(x => x.id !== p.id); persist("payment.delete", { id: p.id, memberId: m.id }); render(); toast("Payment deleted.");
    });
  },
  demo() { loadDemo(); },
  wipe() {
    confirmBox("Erase everything?", "All members, loans and payments stored in this browser will be deleted. Export a backup first if you might need them.", "Erase everything", () => {
      Store.data = { members: [], counters: { member: 0, receipt: 0 }, settings: Store.data.settings }; state.open.clear(); persist("wipe", null); render(); toast("All data erased.");
    });
  },
  exportMembers, exportPayments,
  exportJson() { download("okello-loans-backup-" + today() + ".json", JSON.stringify(Store.data, null, 2), "application/json"); }
};
document.addEventListener("click", e => {
  $$("details.menu[open]").forEach(d => { if (!(e.target.closest("summary") && d.contains(e.target))) d.removeAttribute("open"); });
  const el = e.target.closest("[data-action]"); if (!el) return;
  const fn = actions[el.dataset.action]; if (fn) fn(el.dataset.id, el, e);
});
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target;
  ({ member: submitMember, payment: submitPayment, renew: submitRenew, login: submitLogin, changePassword: submitChangePassword }[f.dataset.form] || (() => {}))(f);
});
function onInput(e) {
  const t = e.target, id = t.id;
  if (id === "mSearch") { state.q = t.value; return renderMemberList(); }
  if (id === "pSearch") { state.pq = t.value; return renderLedger(); }
  if (id === "pMode") { state.pmode = t.value; return renderLedger(); }
  if (id === "pFrom") { state.pfrom = t.value; return renderLedger(); }
  if (id === "pTo") { state.pto = t.value; return renderLedger(); }
  if (id === "pickQ") return renderPicker();
  if (id === "staffName") { Store.data.settings.staff = t.value.trim(); Store.save(); return render_foot(); }
  if (id === "restoreFile" && e.type === "change") return restoreBackup(t.files[0], t);
  const f = t.closest && t.closest("form[data-form]");
  if (f) ({ member: memberFormLive, payment: payFormLive, renew: renewLive }[f.dataset.form] || (() => {}))(f);
}
document.addEventListener("input", onInput); document.addEventListener("change", onInput);
function render_foot() {
  const staffLine = Store.data.settings.staff ? `Working as <b style="color:#fff">${esc(Store.data.settings.staff)}</b>` : `<a href="#settings">Set your name</a>`;
  $("#sideFoot").innerHTML = `${staffLine}<div style="margin-top:10px"><button class="btn ghost sm" style="color:#D3E4E2;border-color:rgba(255,255,255,.25);padding:5px 10px;font-size:12.5px" data-action="logout">Log out (${esc(adminUser || "")})</button></div>`;
}
function restoreBackup(file, input) {
  if (!file) return; const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if (!d || !Array.isArray(d.members)) throw new Error("bad");
      confirmBox("Restore this backup?", `This replaces everything in the app with the ${d.members.length} members in <b>${esc(file.name)}</b>.`, "Restore", () => {
        Store.data = Object.assign({ members: [], counters: { member: 0, receipt: 0 }, settings: Store.data.settings }, d); persist("bulk.replace", { members: Store.data.members }); state.open.clear(); render(); toast("Backup restored.");
      });
    } catch (err) { toast("That file is not a valid backup."); }
    input.value = "";
  };
  r.readAsText(file);
}

state.view = location.hash.slice(1) || "dashboard";
