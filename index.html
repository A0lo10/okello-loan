<!--
=====================================================================
OKELLO LOGIN PAGE - DROP-IN REPLACEMENT   (2 swaps, nothing else changes)
All ids/classes your JS uses are kept: #loginScreen #loginForm #loginUser
#loginPass #loginErr #loginBtn  -> login, session and logout keep working.

SWAP 1 (CSS): in your <style>, delete everything from
      /* ---------- login ---------- */
   down to and including the line starting  .login-foot{
   (KEEP the .msg, .msg-good, .msg-bad lines that follow - Settings uses them)
   Paste PART A in its place.

SWAP 2 (HTML): replace the whole  <div id="loginScreen" ...> ... </div>
   block (the one right after <body>, ending before <div class="app">)
   with PART B.
=====================================================================
-->

<!-- ===================== PART A : CSS ===================== -->
<style>
/* ---------- login (full page) ---------- */
#loginScreen{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--paper);overflow:auto}
body.authed #loginScreen{display:none}
body:not(.authed) .app{display:none}

/* left: brand stage with floating shapes */
.lg-stage{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:48px 36px;color:#fff;
  background:radial-gradient(700px 520px at 20% 15%,#14696C 0%,transparent 62%),radial-gradient(640px 480px at 90% 100%,rgba(242,174,28,.22) 0%,transparent 60%),linear-gradient(160deg,#0E4F52,#0A3B3D 70%)}
.lg-stage h1{font-size:34px;text-align:center;color:#fff;max-width:14ch}
.lg-stage p{margin:0;text-align:center;color:#A9D0CD;max-width:30ch;font-size:16px}
.lg-logo{width:210px;height:210px;filter:drop-shadow(0 22px 28px rgba(0,0,0,.35));animation:lgBob 6s ease-in-out infinite;position:relative;z-index:2}
.lg-logo .ring{transform-origin:100px 100px;animation:lgSpin 60s linear infinite}
.lg-logo .bolt{transform-origin:100px 100px;animation:lgPulse 3.2s ease-in-out infinite}
.lg-stage .copy{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px}

.fl{position:absolute;display:block;pointer-events:none;animation:lgFloat var(--d,14s) ease-in-out infinite;animation-delay:var(--w,0s)}
.fl.coin{width:var(--s,54px);height:var(--s,54px);border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFE08A 0%,var(--amber) 55%,var(--amber-deep) 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.28),0 10px 20px rgba(0,0,0,.25);opacity:.92}
.fl.coin::after{content:"";position:absolute;inset:22%;border-radius:50%;border:2px solid rgba(58,41,0,.35)}
.fl.bub{width:var(--s,80px);height:var(--s,80px);border-radius:50%;background:rgba(124,195,190,.14);border:1.5px solid rgba(124,195,190,.35)}
.fl.bar{width:var(--s,60px);height:12px;border-radius:99px;background:rgba(124,195,190,.35)}
.fl.bar.a{background:rgba(242,174,28,.55)}
@keyframes lgFloat{0%,100%{transform:translate3d(0,0,0) rotate(0)}33%{transform:translate3d(14px,-26px,0) rotate(8deg)}66%{transform:translate3d(-12px,-10px,0) rotate(-6deg)}}
@keyframes lgBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes lgSpin{to{transform:rotate(360deg)}}
@keyframes lgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* right: form */
.lg-panel{display:flex;align-items:center;justify-content:center;padding:40px 28px;position:relative}
.lg-panel::before{content:"";position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;background:var(--amber-tint);opacity:.7;animation:lgFloat 18s ease-in-out infinite}
.lg-card{position:relative;width:100%;max-width:390px}
.lg-card h2{font-size:30px;margin-bottom:6px}
.lg-card .login-tag{color:var(--muted);margin:0 0 26px;font-size:15px}
.lg-card form{text-align:left}
.login-foot{margin:26px 0 0;color:var(--muted);font-size:12.5px}
.lg-card .fld input{padding:12px 13px;font-size:16px}
.lg-mobile-logo{display:none}

@media (max-width:860px){
  #loginScreen{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .lg-stage{padding:26px 20px 30px;gap:12px}
  .lg-logo{width:120px;height:120px}
  .lg-stage h1{font-size:24px;max-width:none}
  .lg-stage p{display:none}
  .lg-panel{padding:26px 20px 40px;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){.fl,.lg-logo,.lg-logo .ring,.lg-logo .bolt,.lg-panel::before{animation:none!important}}
</style>

<!-- ===================== PART B : HTML ===================== -->
<div id="loginScreen" class="login-wrap">

    <span class="fl coin" style="--s:62px;--d:13s;--w:-2s;left:8%;top:12%"></span>

          <rect x="97.5" y="6" width="5" height="16" rx="2.5" fill="#7CC3BE" transform="rotate(166.15 100 100)"/>
          <rect x="97.5" y="6" width="5" height="16" rx="2.5" fill="#7CC3BE" transform="rotate(193.85 100 100)"/>
          <rect x="97.5" y="6" width="5" height="16" rx="2.5" fill="#F2AE1C" transform="rotate(221.54 100 100)"/>
          <rect x="97.5" y="6" width="5" height="16" rx="2.5" fill="#2D6A6C" transform="rotate(249.23 100 100)"/>
          <rect x="97.5" y="6" width="5" height="16" rx="2.5" fill="#2D6A6C" transform="rotate(276.92 100 100)"/>
          <rect x="97.5" y="6" width="5" height="16" rx="2.5" fill="#2D6A6C" transform="rotate(304.62 100 100)"/>
          <rect x="97.5" y="6" width="5" height="16" rx="2.5" fill="#2D6A6C" transform="rotate(332.31 100 100)"/>
        </g>
      </g>
      <circle cx="100" cy="100" r="72" fill="url(#lgDisc)"/>
      <circle cx="100" cy="100" r="72" fill="none" stroke="#7CC3BE" stroke-opacity=".45" stroke-width="2"/>
      <circle cx="100" cy="100" r="52" fill="url(#lgCoin)"/>
      <circle cx="100" cy="100" r="52" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
      <circle cx="100" cy="100" r="43" fill="none" stroke="#3A2900" stroke-opacity=".25" stroke-width="2" stroke-dasharray="3 5"/>
      <polygon class="bolt" points="108,66 78,106 98,106 92,136 124,92 103,92" fill="url(#lgBolt)"/>
    </svg>

    <div class="copy">
      <h1>Okello's Emergency Quick Loans</h1>
      <p>Fast cash when it can't wait. 13 days, fair terms.</p>
    </div>
  </section>

  <section class="lg-panel">
    <div class="lg-card">
      <h2>Welcome back</h2>
      <p class="login-tag">Log in to manage loans and record payments.</p>
      <form id="loginForm" data-form="login" novalidate>
        <div class="fld"><label for="loginUser">Username</label><input id="loginUser" name="username" type="text" autocomplete="username" placeholder="Username"></div>
        <div class="fld" style="margin-top:12px"><label for="loginPass">Password</label><input id="loginPass" name="password" type="password" autocomplete="current-password" placeholder="Password"></div>
        <div class="err" id="loginErr" style="margin-top:10px"></div>
        <button type="submit" class="btn amber" id="loginBtn" style="width:100%;justify-content:center;margin-top:14px;padding:12px 15px;font-size:16px">Log in</button>
      </form>
      <p class="login-foot">Okello's Emergency Quick Loans &middot; staff access only</p>
    </div>
  </section>
</div>
